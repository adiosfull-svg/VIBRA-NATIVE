# Prova: tutte le sezioni (tranne Semine) ferme e poi scorse a lanci veloci, per trovare dove il JS lavora
# durante lo scorrimento (microstuttering). Analisi: tools/scorrimento/analizza.py sui battiti del logcat.
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|FATTURATO TOTALE|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|FATTURATO TOTALE"
    timeout: 180000
# precaricamento delle tab
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 40000
    optional: true
- runFlow:
    when:
      true: ${EMAIL == 'admin@vibra.local'}
    commands:
      - takeScreenshot: scorri-dashboard
      - runFlow: ../sub/scorri.yaml
- tapOn: "Il Mio"
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 6000
    optional: true
- takeScreenshot: scorri-tab-il-mio
- runFlow: ../sub/scorri.yaml
- tapOn: "Weekend"
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 6000
    optional: true
- takeScreenshot: scorri-tab-weekend
- runFlow: ../sub/scorri.yaml
- tapOn: "Clienti"
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 6000
    optional: true
- takeScreenshot: scorri-tab-clienti
- runFlow: ../sub/scorri.yaml
# Clienti > Growth (tabella virtualizzata): la barra delle tab scorre in orizzontale, passi brevi
# (Clienti è già aperta e scorsa: openLink non rimonta la tab) in cima prima di scorrere le tab
- repeat:
    while:
      notVisible: "LISTA CLIENTI"
    times: 12
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 90%
          duration: 200
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 30000
- repeat:
    while:
      notVisible: "Growth League.*"
    times: 10
    commands:
      - swipe:
          start: 75%, 16%
          end: 45%, 16%
          duration: 600
      - waitForAnimationToEnd
      - tapOn:
          text: "Growth"
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 6000
    optional: true
- takeScreenshot: scorri-clienti-growth
- runFlow: ../sub/scorri.yaml
- openLink: vibra://notifiche
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 12000
    optional: true
- takeScreenshot: scorri-notifiche
- runFlow: ../sub/scorri.yaml
- openLink: vibra://formazione
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 12000
    optional: true
- takeScreenshot: scorri-formazione
- runFlow: ../sub/scorri.yaml
- openLink: vibra://academy
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 12000
