# Prova: Achievement aperto da link e scorso (confronto base / liste virtualizzate).
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "I Miei Progressi"
    timeout: 180000
- waitForAnimationToEnd
# ── Achievement (card in PageWindowList sul telefono) ──
- openLink: vibra://il-mio-vibra?tab=achievements
- extendedWaitUntil:
    visible: "Primo cliente|Rete in crescita|Diecimila"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: liste-achievement-01
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
          duration: 300
- waitForAnimationToEnd
- takeScreenshot: liste-achievement-02
- assertNotVisible: "Si è verificato un errore"
