# Prova: viste native dell'app dopo l'avvio (Il Mio Vibra + tab precaricate), contate da viste.sh con
# dumpsys activity top (anche quelle fuori schermo: Robo di Test Lab le visita tutte).
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "I Miei Progressi"
    timeout: 180000
# precaricamento delle tab e delle foto
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 40000
    optional: true
# stesso percorso di Robo (tools/testlab robo-pr): Clienti e dettaglio cliente, 25 s ciascuno per VIBRA_A11Y
- tapOn: "Clienti"
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 60000
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 25000
    optional: true
- tapOn: "Sofia Colombo"
- extendedWaitUntil:
    visible: "Skill del cliente"
    timeout: 60000
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 25000
    optional: true
