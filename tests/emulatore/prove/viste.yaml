# Prova: viste native dell'app dopo l'avvio (Il Mio Vibra + tab precaricate), contate da viste.sh con
# dumpsys activity top (anche quelle fuori schermo: Robo di Test Lab le visita tutte).
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "I Miei Progressi"
    timeout: 180000
# precaricamento delle tab e delle foto
- extendedWaitUntil:
    visible: "testo-che-non-esiste"
    timeout: 40000
    optional: true
