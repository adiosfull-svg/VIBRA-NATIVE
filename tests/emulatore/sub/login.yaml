# Login con l'utente di prova se l'app mostra la schermata di accesso (build senza accesso automatico).
appId: com.vibra.mobile
---
- runFlow:
    when:
      visible: "Password"
    commands:
      - tapOn: "Email"
      - inputText: "admin@vibra.local"
      - tapOn: "Password"
      - inputText: "vibra"
      - hideKeyboard
      - tapOn: "Accedi"
