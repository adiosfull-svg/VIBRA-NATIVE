# Admin: lista dei Promoter (card in PageWindowList sul telefono) si apre e scorre.
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "FATTURATO TOTALE|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "FATTURATO TOTALE"
    timeout: 180000
- openLink: vibra://promoter
- extendedWaitUntil:
    visible: "Marco Esposito|Si è verificato un errore"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: liste-promoter-01
- repeat:
    times: 6
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
          duration: 300
- waitForAnimationToEnd
- takeScreenshot: liste-promoter-02
- assertNotVisible: "Si è verificato un errore"
