# Admin: Report (thread "liste non virtualizzate", 19/10). Gruppo Vibra: tabella Serate (48) nel riquadro
# max-h-96 con righe montate a blocchi scorrendo il riquadro; Confronto Serate con tutte le serate: menu
# delle serate che cresce scorrendo, tabelle di dettaglio per serata a blocchi, grafico a fasce.
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "FATTURATO TOTALE|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "FATTURATO TOTALE"
    timeout: 180000
- openLink: vibra://report
- extendedWaitUntil:
    visible: "Costruttore Report|Si è verificato un errore"
    timeout: 90000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Genera Report"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Genera Report"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Serate \\(\\d+\\)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: report-serate-01
# il riquadro max-h-96 sta sotto il titolo (al centro dello schermo): trascinamenti dentro il riquadro,
# lontano dalla barra in basso, fino all'ultima serata
- repeat:
    times: 16
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 62%
          duration: 300
- waitForAnimationToEnd
- takeScreenshot: report-serate-02-fondo
- assertNotVisible: "Si è verificato un errore"
# ── Confronto Serate: tutte le serate ──
- scrollUntilVisible:
    element: "Confronto Serate"
    direction: UP
    centerElement: true
    timeout: 60000
- tapOn: "Confronto Serate"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Seleziona serate..."
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Seleziona serate..."
- waitForAnimationToEnd
# la ricerca del menu prende il fuoco (autoFocus): la tastiera coprirebbe le serate
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: report-menu-01
# il menu sporge dal riquadro: per Android le voci possono non risultare visibili (Maestro non le trova
# per testo), si prova il testo e poi il punto ("Seleziona tutte" è la prima voce sotto la ricerca)
- tapOn:
    text: "Seleziona tutte \\(\\d+\\)"
    optional: true
- runFlow:
    when:
      visible: "Seleziona serate..."
    commands:
      - tapOn:
          point: "50%,58%"
- waitForAnimationToEnd
# menu delle serate (prima ne mostrava solo 12): scorrendo arriva anche la più vecchia
- repeat:
    times: 10
    commands:
      - swipe:
          start: 50%, 76%
          end: 50%, 60%
          duration: 300
- waitForAnimationToEnd
- takeScreenshot: report-menu-02-fondo
- tapOn: "Serate da confrontare:"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Genera Report"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Genera Report"
- waitForAnimationToEnd
- takeScreenshot: report-confronto-01
- repeat:
    while:
      notVisible: "Fatturato per Serata"
    times: 80
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 15%
          duration: 250
- waitForAnimationToEnd
- takeScreenshot: report-confronto-02-grafico
- repeat:
    times: 6
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 25%
          duration: 400
- waitForAnimationToEnd
- takeScreenshot: report-confronto-03-grafico-fondo
- assertNotVisible: "Si è verificato un errore"
