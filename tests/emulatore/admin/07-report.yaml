# Admin: Report (thread "liste non virtualizzate", 19/10). Gruppo Vibra: tabella Serate (48) nel riquadro
# max-h-96 con righe montate a blocchi scorrendo il riquadro. Confronto Serate non si prova: sul telefono il
# menu delle serate sporge dal suo contenitore e Android non gli passa i tocchi fuori dai bordi (vedi
# STATO-LAVORI, liste minori 19/10).
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "FATTURATO TOTALE|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "FATTURATO TOTALE"
    timeout: 180000
- openLink: vibra://report
- extendedWaitUntil:
    visible: "Costruttore Report|Si è verificato un errore"
    timeout: 90000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Genera Report"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Genera Report"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Serate \\(\\d+\\)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: report-serate-01
# il riquadro max-h-96 sta sotto il titolo (al centro dello schermo): trascinamenti dentro il riquadro,
# lontano dalla barra in basso, fino all'ultima serata
- repeat:
    times: 16
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 62%
          duration: 300
- waitForAnimationToEnd
- takeScreenshot: report-serate-02-fondo
- assertNotVisible: "Si è verificato un errore"
