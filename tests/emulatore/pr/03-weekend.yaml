# PR: Weekend (Programmazione) a schermate.
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "I Miei Progressi"
    timeout: 180000
- waitForAnimationToEnd
- tapOn: "Weekend"
- waitForAnimationToEnd
- takeScreenshot: weekend-01
- swipe:
    start: 50%, 75%
    end: 50%, 30%
    duration: 600
- waitForAnimationToEnd
- runFlow: ../sub/sistema.yaml
