# PR: apertura del dettaglio cliente (Clienti aperta col deep link, indipendente dalla nav bar).
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "I Miei Progressi"
    timeout: 180000
- openLink: vibra://clienti
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: dettaglio-lista
- tapOn: "Sofia Colombo"
- extendedWaitUntil:
    visible: "Skill del cliente"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: dettaglio-aperto
