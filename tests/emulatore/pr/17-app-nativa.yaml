# PR: comportamento da app nativa.
# 1) Avvio con i dati salvati (lib/queryCachePersist + lib/userCache): dopo un primo giro l'app si chiude e
#    riparte; la pagina iniziale e Clienti devono comparire subito con i dati (screenshot appena aperte).
# 2) Chiusura animata dei dialog (ui/enterView usePortalPresence): Nuovo Cliente aperto e chiuso più volte,
#    dopo la chiusura i tocchi arrivano alla pagina.
# 3) Pannello con altezza 'auto' (ui/autoHeight): «Tutti i mesi precedenti» di I Miei Guadagni, se c'è.
appId: com.vibra.mobile
---
- launchApp
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible:
      text: "I Miei Progressi|Password"
    timeout: 180000
- runFlow: ../sub/sistema.yaml
- runFlow: ../sub/login.yaml
- extendedWaitUntil:
    visible: "I Miei Progressi"
    timeout: 180000
- openLink: vibra://clienti
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 90000
- waitForAnimationToEnd
# la cache si scrive 4 s dopo l'ultimo cambio dei dati, a app ferma
- extendedWaitUntil:
    visible: "__attesa_salvataggio_cache__"
    timeout: 15000
    optional: true
- stopApp
- launchApp
- takeScreenshot: avvio-caldo-subito
- runFlow: ../sub/sistema.yaml
- extendedWaitUntil:
    visible: "I Miei Progressi"
    timeout: 180000
- takeScreenshot: avvio-caldo-pronta
- openLink: vibra://clienti
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 90000
- takeScreenshot: clienti-subito
- waitForAnimationToEnd
- repeat:
    times: 3
    commands:
      - tapOn: "Singolo cliente"
      - extendedWaitUntil:
          visible: ".*Nuovo Cliente"
          timeout: 30000
      - waitForAnimationToEnd
      - tapOn: "Chiudi"
      - waitForAnimationToEnd
      - assertNotVisible: ".*Nuovo Cliente"
- takeScreenshot: dialog-chiuso
# dopo la chiusura la pagina risponde subito ai tocchi (il velo in uscita non li blocca)
- tapOn: "Singolo cliente"
- extendedWaitUntil:
    visible: ".*Nuovo Cliente"
    timeout: 30000
- pressKey: back
- waitForAnimationToEnd
- assertNotVisible: ".*Nuovo Cliente"
- openLink: vibra://il-mio-vibra?tab=guadagni
- extendedWaitUntil:
    visible: "Guadagno totale"
    timeout: 90000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Tutti i mesi precedenti"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: "Tutti i mesi precedenti"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: mesi-aperti
- tapOn:
    text: "Tutti i mesi precedenti"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: mesi-chiusi
# 4) Pagine dello stack che entrano scorrendo (Stack con animation 'ios_from_right'): screenshot a metà
#    entrata, poi Indietro (uscita scorrendo) e di nuovo la pagina sotto che risponde.
- openLink: vibra://clienti
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 90000
- waitForAnimationToEnd
- openLink: vibra://notifiche
- takeScreenshot: stack-entrata
- extendedWaitUntil:
    visible: "Notifiche"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: stack-aperta
- pressKey: back
- takeScreenshot: stack-uscita
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 30000
- waitForAnimationToEnd
# 4b) Menu a tendina che esce animato (ui/menu, usePortalPresence): ⋮ del primo cliente (~90%,50%)
- tapOn:
    point: 90%, 50%
- extendedWaitUntil:
    visible: "Modifica cliente"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: menu-aperto
- pressKey: back
- takeScreenshot: menu-uscita
- waitForAnimationToEnd
- assertNotVisible: "Modifica cliente"
- tapOn:
    point: 90%, 50%
- extendedWaitUntil:
    visible: "Modifica cliente"
    timeout: 10000
- waitForAnimationToEnd
# tocco fuori dal menu: si chiude, e subito dopo la pagina risponde
- tapOn:
    point: 50%, 30%
- waitForAnimationToEnd
- assertNotVisible: "Modifica cliente"
- tapOn: "Singolo cliente"
- extendedWaitUntil:
    visible: ".*Nuovo Cliente"
    timeout: 30000
- pressKey: back
- waitForAnimationToEnd
# pagina pesante mai aperta (Analytics clienti): entra subito con l'intestazione, il contenuto arriva scorrendo
- openLink: vibra://clienti-analytics
- takeScreenshot: pesante-entrata
- waitForAnimationToEnd
- takeScreenshot: pesante-aperta
- pressKey: back
- extendedWaitUntil:
    visible: "LISTA CLIENTI"
    timeout: 30000
- waitForAnimationToEnd
# 5) Icona dell'app nel launcher (sfondo #090909)
- pressKey: home
- waitForAnimationToEnd
- takeScreenshot: launcher-icona
