# Emulatore Android per i test automatici (li lancia Claude e ne legge i risultati).
# - compila l'app per x86_64 col backend di PROVA locale (scripts/local, dati sintetici) e accesso
#   automatico con l'utente di prova: nessun login Google, nessun dato reale, nessuna scrittura su Base44
# - avvia lo stack locale sul runner e un emulatore Android 14 (KVM dei runner Linux di GitHub)
# - esegue i percorsi Maestro di tests/emulatore (screenshot, log, albero della UI)
# - pubblica i risultati sul branch "emulatore-risultati" (sovrascritto a ogni run)
# Parte a mano (Actions → "Emulatore" → Run workflow) o con un push il cui messaggio contiene [emu].
# Con [gara] (o gara=si a mano) invece dei percorsi Maestro esegue la gara nativa contro originale
# (tools/gara, docs/PIANO-PRESTAZIONI.md): risultati in gara.md nel branch dei risultati.
# L'APK di questa build NON va distribuito (backend locale e utente di prova incorporati).
name: Emulatore

on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Percorsi da eseguire (file o cartella; vuoto = tests/emulatore/<utente>)'
        required: false
        default: ''
      gpu:
        description: 'Grafica dell emulatore (swangle_indirect; swiftshader_indirect fa cadere l emulatore scorrendo i grafici)'
        required: false
        default: 'swangle_indirect'
      extra_env:
        description: 'Variabili in più per la build di test, separate da ; (es. EXPO_PUBLIC_TEST_NO_BLUR=1)'
        required: false
        default: ''
      app_ref:
        description: 'Commit da cui prendere app/ (vuoto = quello del branch): per confrontare con versioni precedenti'
        required: false
        default: ''
      gara:
        description: 'si = gara nativa contro originale (tools/gara) invece dei percorsi Maestro; navbar = gara della barra in basso e del menu (video, tools/gara/navbar.mjs)'
        required: false
        default: ''
      traccia:
        description: 'si = traccia di sistema Perfetto di ogni percorso (out/tracce/*.pftrace)'
        required: false
        default: ''
      fluidita:
        description: 'si = animazioni attive, video di ogni percorso e frame persi (dumpsys gfxinfo) in fluidita.md'
        required: false
        default: ''
      profilo_js:
        description: 'si = profilo del thread JS (campionatore di Hermes) di ogni percorso: out/profili/*.json e profili.md'
        required: false
        default: ''
  push:
    paths:
      - 'app/**'
      - 'tests/emulatore/**'
      - 'tests/gara/**'
      - 'tools/gara/**'
      - 'scripts/local/**'
      - '.github/workflows/emulatore.yml'

jobs:
  emulatore:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emu]') || contains(github.event.head_commit.message, '[gara]') || contains(github.event.head_commit.message, '[gara-navbar]') || contains(github.event.head_commit.message, '[fluidita]') || contains(github.event.head_commit.message, '[traccia]')
    # a livello di job (i push senza [emu] non annullano niente); le esecuzioni a mano non si annullano
    concurrency:
      # la gara ha un gruppo suo: non annulla (e non è annullata da) un giro di percorsi Maestro
      group: emulatore-${{ github.ref }}-${{ matrix.utente }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}${{ contains(github.event.head_commit.message, '[gara]') && '-gara' || '' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # 120: il giro completo del PR (comitive 5-20 min, liste, liste minori) non stava più in 75 minuti
    timeout-minutes: 120
    # un job per utente di prova (pagine e permessi diversi), in parallelo
    strategy:
      fail-fast: false
      matrix:
        utente: [admin, pr]
    permissions:
      contents: write
    env:
      FLOWS: ${{ github.event.inputs.flows || format('tests/emulatore/{0}', matrix.utente) }}
      EMAIL: ${{ matrix.utente }}@vibra.local
      UTENTE: ${{ matrix.utente }}
      GARA: ${{ (github.event.inputs.gara == 'si' || github.event.inputs.gara == 'navbar' || contains(github.event.head_commit.message, '[gara]') || contains(github.event.head_commit.message, '[gara-navbar]')) && '1' || '' }}
      # [gara-navbar]: solo la gara della barra in basso e del menu laterale (tests/gara/run.sh)
      GARA_NAV: ${{ (github.event.inputs.gara == 'navbar' || contains(github.event.head_commit.message, '[gara-navbar]')) && '1' || '' }}
      # [fluidita]: animazioni attive + video + frame persi per percorso (tests/emulatore/run.sh)
      FLUID: ${{ (github.event.inputs.fluidita == 'si' || contains(github.event.head_commit.message, '[fluidita]')) && '1' || '' }}
      # [traccia]: traccia Perfetto di ogni percorso (tests/emulatore/run.sh)
      TRACE: ${{ (github.event.inputs.traccia == 'si' || contains(github.event.head_commit.message, '[traccia]')) && '1' || '' }}
      # profilo_js: campionatore di Hermes (plugins/withJsProfiler.js), bundle non minificato (nomi delle funzioni)
      JSPROF: ${{ github.event.inputs.profilo_js == 'si' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: app/ da un altro commit (confronti)
        if: github.event.inputs.app_ref != ''
        run: |
          git fetch -q --depth=1 origin ${{ github.event.inputs.app_ref }}
          rm -rf app && git checkout FETCH_HEAD -- app
          echo "app/ da ${{ github.event.inputs.app_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ── stack locale (Postgres + PostgREST + gateway su :54321) ──
      - name: Stack locale di prova
        run: |
          ls -d /usr/lib/postgresql/*/bin
          mkdir -p scripts/local/bin
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ -C scripts/local/bin
          scripts/local/dev_stack.sh --reset
          # più clienti per avere liste lunghe come quelle vere (450)
          P="psql -h $PWD/scripts/local/.data/sock -p 55433 -U postgres -d postgres"
          cols=$($P -At -c "select string_agg(quote_ident(column_name), ',') from information_schema.columns where table_schema='public' and table_name='client' and column_name not in ('id','name')")
          $P -c "insert into client (name, $cols) select c.name || ' ' || g, $cols from client c, generate_series(1,9) g"
          # semine del PR (con note, recettività e stati diversi: le card della pagina Semine)
          # logo della sidebar (AppSettings org_logo) come nell'app vera, per la gara del menu
          $P -c "insert into app_settings (key, value) values ('org_logo', 'https://base44.app/api/apps/69de4f1f7f53d9f187d01392/files/mp/public/69de4f1f7f53d9f187d01392/d42bf9b16_VIBRAPERFETTO2.png')"
          $P -c "insert into semina (name, promoter_id, instagram, phone, eta, provenienza, notes, status, recettivita, display_order) select 'Semina ' || g, 'prom000000000000000001', 'semina.' || g, '+39 333 000 00' || lpad(g::text, 2, '0'), 18 + g % 10, (array['Napoli','Pozzuoli','Vomero','Posillipo'])[1 + g % 4], case when g % 3 = 0 then 'Nota di prova ' || g || ': da richiamare venerdì' end, (array['nuovo','contattato','interessato','convertito'])[1 + g % 4], 1 + g % 5, g from generate_series(1,60) g"
          # liste minori (thread "liste non virtualizzate", pr/13-liste-minori): rami dell'albero dei clienti
          # del PR (40 radici, 2 livelli), tutti i suoi clienti presenti all'ultima serata (riquadro "Già
          # presenti" di Aggiungi presenze) e una chat Instagram lunga (120 messaggi) abbinata a "Semina 1"
          $P -c "with r as (select id, row_number() over (order by name, id) rn from client where promoter_id = 'prom000000000000000001') update client c set referred_by_client_id = p.id from r rc join r p on p.rn = case when rc.rn > 100 then 41 + rc.rn % 60 else 1 + rc.rn % 40 end where c.id = rc.id and rc.rn > 40"
          $P -c "insert into event_attendance (event_id, promoter_id, client_id, present, revenue, table_number) select e.id, c.promoter_id, c.id, true, 100 + (abs(hashtext(c.id)) % 400), '1' from client c, (select id from event order by date desc limit 1) e where c.promoter_id = 'prom000000000000000001' and not exists (select 1 from event_attendance a where a.client_id = c.id and a.event_id = e.id)"
          # statistiche pre-calcolate (cum_*) dei clienti del PR: barre dei grafici di Analitica clienti ("Tutti")
          $P -c "update client set cum_visits = 1 + abs(hashtext(id)) % 20, cum_total_spent = 50 + abs(hashtext(id || 'x')) % 3000 where promoter_id = 'prom000000000000000001'"
          $P -c "update client set cum_avg_spent = round((cum_total_spent / cum_visits)::numeric, 0) where promoter_id = 'prom000000000000000001'"
          $P -c "insert into instagram_message (promoter_id, conversation_id, sender_ig_id, sender_handle, sender_username, message_text, message_type, message_timestamp, matched_semina_id, is_outgoing, is_read) select 'prom000000000000000001', 'conv-prova-1', 'ig-semina-1', 'semina.1', 'Semina Uno', 'Messaggio ' || lpad(g::text, 3, '0'), 'text', now() - interval '6 days' + g * interval '70 minutes', (select id from semina where name = 'Semina 1'), g % 2 = 0, true from generate_series(1,120) g"
          curl -sf http://127.0.0.1:54321/rest/v1/ > /dev/null

      # ── APK x86_64 di prova ──
      - name: Dipendenze
        working-directory: app
        run: npm ci

      - name: Configurazione di prova
        working-directory: app
        run: |
          cat > .env <<'ENV'
          EXPO_PUBLIC_BACKEND=local
          EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY=dev
          EXPO_PUBLIC_TEST_LOGIN=${{ matrix.utente }}@vibra.local:vibra
          ENV
          # gara: solo la sonda leggera (la diagnostica completa rallenterebbe la nativa)
          # fluidità: senza la diagnostica (battito e misure costano frame), come l'APK vero
          if [ "$GARA" = 1 ]; then echo EXPO_PUBLIC_TEST_GARA=1 >> .env; elif [ "$FLUID" != 1 ] && [ "$TRACE" != 1 ]; then echo EXPO_PUBLIC_TEST_DIAG=1 >> .env; fi
          if [ "$JSPROF" = 1 ]; then echo EXPO_PUBLIC_TEST_PROFILE=1 >> .env; fi
          echo "${{ github.event.inputs.extra_env }}" | tr ';' '\n' | grep '=' >> .env || true
          cat .env

      # APK nativo in cache: si ricompila con Gradle (~11 min) solo se cambia la parte nativa
      # (dipendenze, configurazione, immagini); altrimenti si rigenera solo il bundle JS (~1 min) e lo
      # si sostituisce nell'APK in cache (stessa chiave di debug con cui è firmato).
      - name: Chiave della parte nativa
        id: native
        working-directory: app
        run: |
          # solo ciò che entra nella parte nativa (le variabili EXPO_PUBLIC_ finiscono nel bundle JS)
          # + i flag statici di Reanimated in package.json (compilati nel C++), solo se ci sono
          rea=$(node -p "JSON.stringify(require('./package.json').reanimated ?? '')")
          h=$( (cat package-lock.json app.json $(find patches assets plugins -type f 2>/dev/null | sort); echo cleartext-v1 "fluid=$FLUID" "trace=$TRACE"; [ -z "$JSPROF" ] || echo "jsprof=1"; [ "$rea" = '""' ] || echo "reanimated=$rea") | sha256sum | cut -c1-16)
          echo "key=apk-x86_64-$h" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: apkcache
        with:
          path: app/apk-cache
          key: ${{ steps.native.outputs.key }}

      - name: Progetto Android
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          npx expo prebuild -p android --no-install
          # lo stack locale è http (adb reverse su 127.0.0.1): permesso solo in questa build
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          # traccia: app "profileable" (le sue sezioni di Trace e i campioni Java arrivano a Perfetto)
          if [ "$TRACE" = 1 ]; then sed -i 's|</application>|<profileable android:shell="true"/></application>|' android/app/src/main/AndroidManifest.xml; fi
        env:
          CI: 1
          # fluidità: durata dei frame nel logcat (VIBRA_FRAMES, plugins/withFrameMetrics.js)
          VIBRA_FRAME_METRICS: ${{ env.FLUID }}
          VIBRA_JS_PROFILE: ${{ env.JSPROF }}

      - name: Compila APK (x86_64)
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: app/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          mkdir -p ../apk-cache
          cp app/build/outputs/apk/release/app-release.apk app/debug.keystore ../apk-cache/

      - uses: actions/cache/save@v4
        if: steps.apkcache.outputs.cache-hit != 'true'
        with:
          path: app/apk-cache
          key: ${{ steps.native.outputs.key }}

      # (anche dopo una build completa col profilo JS: bundle non minificato, nomi delle funzioni nei campioni)
      - name: Solo JS nell'APK in cache
        if: steps.apkcache.outputs.cache-hit == 'true' || env.JSPROF == '1'
        working-directory: app
        run: |
          mkdir -p /tmp/emb/res /tmp/swap/assets
          npx expo export:embed --platform android --dev false --minify $([ "$JSPROF" = 1 ] && echo false || echo true) --entry-file node_modules/expo-router/entry.js \
            --bundle-output /tmp/emb/index.android.bundle --assets-dest /tmp/emb/res
          node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -emit-binary -O -w -out /tmp/swap/assets/index.android.bundle /tmp/emb/index.android.bundle
          cp apk-cache/app-release.apk /tmp/js.apk
          (cd /tmp/swap && zip -q -0 /tmp/js.apk assets/index.android.bundle)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 /tmp/js.apk apk-cache/app-test.apk
          "$BT/apksigner" sign --ks apk-cache/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey apk-cache/app-test.apk

      - name: APK da provare
        working-directory: app
        run: |
          if [ -f apk-cache/app-test.apk ]; then echo "APK=$PWD/apk-cache/app-test.apk" >> "$GITHUB_ENV"; else echo "APK=$PWD/apk-cache/app-release.apk" >> "$GITHUB_ENV"; fi

      # ── gara: originale (build di produzione con sonda, tools/gara/riferimento.tar.gz) e Playwright ──
      - name: Originale per la gara
        if: env.GARA == '1'
        run: |
          mkdir -p /tmp/gara-ref
          tar -xzf tools/gara/riferimento.tar.gz -C /tmp/gara-ref
          ls /tmp/gara-ref | head
          echo "GARA_REF=/tmp/gara-ref" >> "$GITHUB_ENV"
          (cd tools/gara && npm install --no-audit --no-fund --silent)
          if [ "$GARA_NAV" = 1 ]; then command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg); python3 -c 'import numpy' || pip install numpy; fi

      # ── emulatore ──
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Test sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu ${{ github.event.inputs.gpu || 'swangle_indirect' }} -noaudio -no-boot-anim -camera-back none
          disable-animations: ${{ env.FLUID != '1' }}
          script: bash ${{ env.GARA == '1' && 'tests/gara/run.sh' || 'tests/emulatore/run.sh' }}

      - name: Pubblica i risultati
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b emulatore-risultati
          git config user.name "emulatore"
          git config user.email "emulatore@users.noreply.github.com"
          echo "run ${{ github.run_id }} — utente ${{ matrix.utente }} — commit ${{ github.sha }} — app_ref ${{ github.event.inputs.app_ref || 'head' }} — $(date -u)" > INFO.txt
          git add -A
          git commit -qm "Risultati emulatore: run ${{ github.run_id }} ${{ matrix.utente }} (${GITHUB_SHA::7})"
          # un branch per run e utente + l'ultimo per utente; push separati: con più giri in parallelo
          # l'aggiornamento dell'"ultimo" può fallire e prima si perdevano anche i risultati del giro
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -fq "$R" HEAD:refs/heads/emulatore-risultati-${{ github.run_id }}-${{ matrix.utente }}
          for i in 1 2 3; do git push -fq "$R" HEAD:refs/heads/emulatore-risultati-${{ matrix.utente }} && break; sleep $((i * 5)); done || true
