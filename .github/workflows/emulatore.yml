# Emulatore Android per i test automatici (li lancia Claude e ne legge i risultati).
# - compila l'app per x86_64 col backend di PROVA locale (scripts/local, dati sintetici) e accesso
#   automatico con l'utente di prova: nessun login Google, nessun dato reale, nessuna scrittura su Base44
# - avvia lo stack locale sul runner e un emulatore Android 14 (KVM dei runner Linux di GitHub)
# - esegue i percorsi Maestro di tests/emulatore (screenshot, log, albero della UI)
# - pubblica i risultati sul branch "emulatore-risultati" (sovrascritto a ogni run)
# Parte a mano (Actions → "Emulatore" → Run workflow) o con un push il cui messaggio contiene [emu].
# L'APK di questa build NON va distribuito (backend locale e utente di prova incorporati).
name: Emulatore

on:
  workflow_dispatch:
    inputs:
      flows:
        description: 'Percorsi da eseguire (file o cartella in tests/emulatore)'
        required: false
        default: 'tests/emulatore'
      gpu:
        description: 'Grafica dell emulatore (swangle_indirect; swiftshader_indirect fa cadere l emulatore scorrendo i grafici)'
        required: false
        default: 'swangle_indirect'
      extra_env:
        description: 'Variabili in più per la build di test, separate da ; (es. EXPO_PUBLIC_TEST_NO_BLUR=1)'
        required: false
        default: ''
      app_ref:
        description: 'Commit da cui prendere app/ (vuoto = quello del branch): per confrontare con versioni precedenti'
        required: false
        default: ''
  push:
    paths:
      - 'app/**'
      - 'tests/emulatore/**'
      - 'scripts/local/**'
      - '.github/workflows/emulatore.yml'

concurrency:
  # i push si annullano a vicenda; le esecuzioni a mano (prove in parallelo) no
  group: emulatore-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  emulatore:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emu]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      FLOWS: ${{ github.event.inputs.flows || 'tests/emulatore' }}
    steps:
      - uses: actions/checkout@v4

      - name: app/ da un altro commit (confronti)
        if: github.event.inputs.app_ref != ''
        run: |
          git fetch -q --depth=1 origin ${{ github.event.inputs.app_ref }}
          rm -rf app && git checkout FETCH_HEAD -- app
          echo "app/ da ${{ github.event.inputs.app_ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ── stack locale (Postgres + PostgREST + gateway su :54321) ──
      - name: Stack locale di prova
        run: |
          ls -d /usr/lib/postgresql/*/bin
          mkdir -p scripts/local/bin
          curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ -C scripts/local/bin
          scripts/local/dev_stack.sh --reset
          # più clienti per avere liste lunghe come quelle vere (450)
          P="psql -h $PWD/scripts/local/.data/sock -p 55433 -U postgres -d postgres"
          cols=$($P -At -c "select string_agg(quote_ident(column_name), ',') from information_schema.columns where table_schema='public' and table_name='client' and column_name not in ('id','name')")
          $P -c "insert into client (name, $cols) select c.name || ' ' || g, $cols from client c, generate_series(1,9) g"
          curl -sf http://127.0.0.1:54321/rest/v1/ > /dev/null

      # ── APK x86_64 di prova ──
      - name: Dipendenze
        working-directory: app
        run: npm ci

      - name: Configurazione di prova
        working-directory: app
        run: |
          cat > .env <<'ENV'
          EXPO_PUBLIC_BACKEND=local
          EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY=dev
          EXPO_PUBLIC_TEST_LOGIN=admin@vibra.local:vibra
          EXPO_PUBLIC_TEST_DIAG=1
          ENV
          echo "${{ github.event.inputs.extra_env }}" | tr ';' '\n' | grep '=' >> .env || true
          cat .env

      # APK nativo in cache: si ricompila con Gradle (~11 min) solo se cambia la parte nativa
      # (dipendenze, configurazione, immagini); altrimenti si rigenera solo il bundle JS (~1 min) e lo
      # si sostituisce nell'APK in cache (stessa chiave di debug con cui è firmato).
      - name: Chiave della parte nativa
        id: native
        working-directory: app
        run: |
          # solo ciò che entra nella parte nativa (le variabili EXPO_PUBLIC_ finiscono nel bundle JS)
          h=$( (cat package-lock.json app.json $(find patches assets plugins -type f 2>/dev/null | sort); echo cleartext-v1) | sha256sum | cut -c1-16)
          echo "key=apk-x86_64-$h" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: apkcache
        with:
          path: app/apk-cache
          key: ${{ steps.native.outputs.key }}

      - name: Progetto Android
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          npx expo prebuild -p android --no-install
          # lo stack locale è http (adb reverse su 127.0.0.1): permesso solo in questa build
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
        env:
          CI: 1

      - name: Compila APK (x86_64)
        if: steps.apkcache.outputs.cache-hit != 'true'
        working-directory: app/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          mkdir -p ../apk-cache
          cp app/build/outputs/apk/release/app-release.apk app/debug.keystore ../apk-cache/

      - uses: actions/cache/save@v4
        if: steps.apkcache.outputs.cache-hit != 'true'
        with:
          path: app/apk-cache
          key: ${{ steps.native.outputs.key }}

      - name: Solo JS nell'APK in cache
        if: steps.apkcache.outputs.cache-hit == 'true'
        working-directory: app
        run: |
          mkdir -p /tmp/emb/res /tmp/swap/assets
          npx expo export:embed --platform android --dev false --minify true --entry-file node_modules/expo-router/entry.js \
            --bundle-output /tmp/emb/index.android.bundle --assets-dest /tmp/emb/res
          node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -emit-binary -O -w -out /tmp/swap/assets/index.android.bundle /tmp/emb/index.android.bundle
          cp apk-cache/app-release.apk /tmp/js.apk
          (cd /tmp/swap && zip -q -0 /tmp/js.apk assets/index.android.bundle)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 /tmp/js.apk apk-cache/app-test.apk
          "$BT/apksigner" sign --ks apk-cache/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey apk-cache/app-test.apk

      - name: APK da provare
        working-directory: app
        run: |
          if [ -f apk-cache/app-test.apk ]; then echo "APK=$PWD/apk-cache/app-test.apk" >> "$GITHUB_ENV"; else echo "APK=$PWD/apk-cache/app-release.apk" >> "$GITHUB_ENV"; fi

      # ── emulatore ──
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Test sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu ${{ github.event.inputs.gpu || 'swangle_indirect' }} -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/emulatore/run.sh

      - name: Pubblica i risultati
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          git init -q -b emulatore-risultati
          git config user.name "emulatore"
          git config user.email "emulatore@users.noreply.github.com"
          echo "run ${{ github.run_id }} — commit ${{ github.sha }} — app_ref ${{ github.event.inputs.app_ref || 'head' }} — $(date -u)" > INFO.txt
          git add -A
          git commit -qm "Risultati emulatore: run ${{ github.run_id }} (${GITHUB_SHA::7})"
          # un branch per run (emulatore-risultati/<run>) + l'ultimo su emulatore-risultati
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:emulatore-risultati HEAD:refs/heads/emulatore-risultati-${{ github.run_id }}
